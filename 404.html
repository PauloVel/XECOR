<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Evrabo</title>
  <meta name="description" content="Signal lost. This page went off the map. Get back to base.">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="15;url=index.html">
  <meta name="theme-color" content="#050505">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="assets/fonts/Anton-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/anton.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --black: #050505;
      --white: #f0f0f0;
      --red: #ff1a1a;
      --gray: #1a1a1a;
    }

    html {
      overflow-x: hidden;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      cursor: none;
    }

    /* Custom Cursor */
    .cursor {
      position: fixed;
      width: 12px;
      height: 12px;
      background: var(--white);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference;
      transition: transform 0.1s ease;
    }

    .cursor-follower {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 1px solid var(--white);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      mix-blend-mode: difference;
      transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
    }

    .cursor.hover {
      transform: scale(3);
      background: var(--red);
    }

    .cursor-follower.hover {
      width: 60px;
      height: 60px;
      border-color: var(--red);
    }

    /* Noise Overlay */
    .noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9990;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9991;
      opacity: 0.03;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.03) 2px,
        rgba(255,255,255,0.03) 4px
      );
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 2rem 4vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      mix-blend-mode: difference;
    }

    .nav-logo {
      font-family: 'Anton', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      color: var(--white);
      text-decoration: none;
      transition: letter-spacing 0.4s ease;
    }

    .nav-logo:hover {
      letter-spacing: 0.3em;
    }

    .nav-links {
      display: flex;
      gap: 3rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--white);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 4px;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--red);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-links a:hover {
      color: var(--red);
    }

    /* Lost Signal Stage */
    .lost-stage {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10vh 4vw;
      overflow: hidden;
    }

    .lost-stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(26,26,26,0.5) 0%, var(--black) 70%);
      z-index: 0;
      pointer-events: none;
    }

    .lost-kicker {
      position: relative;
      z-index: 1;
      font-size: clamp(0.7rem, 1.2vw, 0.9rem);
      letter-spacing: 0.6em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 1.5rem;
      animation: blink 2.4s steps(2, start) infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .lost-code {
      position: relative;
      z-index: 1;
      font-family: 'Anton', sans-serif;
      font-size: clamp(7rem, 26vw, 22rem);
      line-height: 0.85;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--white);
    }

    .lost-line {
      position: relative;
      z-index: 1;
      width: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      margin: 2.5rem 0;
      animation: slashGrow 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    @keyframes slashGrow {
      to { width: min(420px, 60vw); }
    }

    .lost-sub {
      position: relative;
      z-index: 1;
      font-size: clamp(0.85rem, 1.5vw, 1.1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 3rem;
    }

    .lost-btn {
      position: relative;
      z-index: 1;
      display: inline-block;
      padding: 1.2rem 4rem;
      border: 1px solid var(--white);
      color: var(--white);
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .lost-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--red);
      transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: -1;
    }

    .lost-btn:hover::before {
      left: 0;
    }

    .lost-btn:hover {
      border-color: var(--red);
    }

    /* Glitch effect class */
    .glitch-text {
      position: relative;
    }

    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
    }

    .glitch-text.active::before {
      animation: glitch-1 0.3s ease;
      color: var(--red);
      z-index: -1;
      opacity: 0.8;
    }

    .glitch-text.active::after {
      animation: glitch-2 0.3s ease;
      color: cyan;
      z-index: -2;
      opacity: 0.8;
    }

    @keyframes glitch-1 {
      0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
      20% { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 2px); }
      40% { clip-path: inset(50% 0 30% 0); transform: translate(3px, -2px); }
      60% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 1px); }
      80% { clip-path: inset(70% 0 10% 0); transform: translate(2px, -1px); }
    }

    @keyframes glitch-2 {
      0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
      20% { clip-path: inset(60% 0 20% 0); transform: translate(3px, -2px); }
      40% { clip-path: inset(30% 0 50% 0); transform: translate(-3px, 2px); }
      60% { clip-path: inset(80% 0 10% 0); transform: translate(2px, -1px); }
      80% { clip-path: inset(10% 0 70% 0); transform: translate(-2px, 1px); }
    }

    /* Mobile Menu Toggle */
    .nav-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 200;
      padding: 0;
    }

    .nav-toggle span {
      display: block;
      width: 100%;
      height: 2px;
      background: var(--white);
      transition: all 0.3s ease;
    }

    .nav-toggle.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .nav-toggle.active span:nth-child(2) {
      opacity: 0;
    }

    .nav-toggle.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    .nav-mobile {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .nav-mobile.open {
      opacity: 1;
      pointer-events: auto;
    }

    .nav-mobile-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      text-align: center;
    }

    .nav-mobile-links a {
      font-family: 'Anton', sans-serif;
      font-size: clamp(2.5rem, 10vw, 5rem);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--white);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .nav-mobile-links a:hover {
      color: var(--red);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-toggle { display: flex; }
      .cursor, .cursor-follower { display: none; }
      body { cursor: auto; }
    }
  </style>
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-follower"></div>
  <div class="noise"></div>
  <div class="scanlines"></div>

  <nav>
    <a href="index.html" class="nav-logo">EVRABO</a>
    <ul class="nav-links">
      <li><a href="originals.html">Originals</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>
  <div class="nav-mobile">
    <ul class="nav-mobile-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="originals.html">Originals</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>

  <main class="lost-stage">
    <div class="lost-kicker">Have to wait</div>
    <h1 class="lost-code glitch-text" data-text="404">404</h1>
    <div class="lost-line"></div>
    <p class="lost-sub">You are not ready for this.</p>
    <a href="index.html" class="lost-btn">Back to Main</a>
  </main>

  <script>
    // Custom Cursor (disabled on touch devices)
    const isTouchDevice = window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 768;
    if (!isTouchDevice) {
      const cursor = document.querySelector('.cursor');
      const follower = document.querySelector('.cursor-follower');
      let mouseX = 0, mouseY = 0;
      let cursorX = 0, cursorY = 0;
      let followerX = 0, followerY = 0;

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      function animateCursor() {
        cursorX += (mouseX - cursorX) * 0.2;
        cursorY += (mouseY - cursorY) * 0.2;
        followerX += (mouseX - followerX) * 0.1;
        followerY += (mouseY - followerY) * 0.1;

        cursor.style.transform = `translate(${cursorX - 6}px, ${cursorY - 6}px)`;
        follower.style.transform = `translate(${followerX - 20}px, ${followerY - 20}px)`;

        requestAnimationFrame(animateCursor);
      }
      animateCursor();

      document.querySelectorAll('a').forEach(el => {
        el.addEventListener('mouseenter', () => {
          cursor.classList.add('hover');
          follower.classList.add('hover');
        });
        el.addEventListener('mouseleave', () => {
          cursor.classList.remove('hover');
          follower.classList.remove('hover');
        });
      });
    }

    // Glitch Text Trigger
    const glitchTexts = document.querySelectorAll('.glitch-text');
    const glitchObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
          setTimeout(() => entry.target.classList.remove('active'), 400);
        }
      });
    }, { threshold: 0.3 });

    glitchTexts.forEach(el => {
      glitchObserver.observe(el);
      setInterval(() => {
        if (Math.random() > 0.85) {
          el.classList.add('active');
          setTimeout(() => el.classList.remove('active'), 300);
        }
      }, 2600);
    });

    // Mobile menu toggle
    const navToggle = document.querySelector('.nav-toggle');
    const navMobile = document.querySelector('.nav-mobile');
    if (navToggle && navMobile) {
      navToggle.addEventListener('click', () => {
        const isOpen = navMobile.classList.toggle('open');
        navToggle.classList.toggle('active');
        navToggle.setAttribute('aria-expanded', isOpen);
        document.body.style.overflow = isOpen ? 'hidden' : '';
      });

      navMobile.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          navMobile.classList.remove('open');
          navToggle.classList.remove('active');
          navToggle.setAttribute('aria-expanded', 'false');
          document.body.style.overflow = '';
        });
      });
    }
  </script>
</body>
</html>
