<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katana — EVRABO SS/26 Issue II</title>
  <meta name="description" content="KATANA, EVRABO's SS/26 Issue II: The Work. 48 pages, perfect bound, limited run.">
  <meta property="og:title" content="KATANA — EVRABO Issue II: The Work">
  <meta property="og:description" content="48 pages, perfect bound, limited run.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://evrabo.com/katana.html">
  <meta property="og:image" content="https://evrabo.com/assets/images/pc/Image1.jpeg">
  <meta name="theme-color" content="#050505">
  <link rel="canonical" href="https://evrabo.com/katana.html">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="assets/fonts/Anton-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/anton.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!--
    SPEC (WEBSITE_BLUEPRINT.md, section 8)
    SITE: Katana, SS/26 Issue II "The Work"      PURPOSE: show the issue and get access to it
    ONE ACTION: Get access (contact.html)        FEELING: raw, direct, tense   NOT: corporate, cute, busy
    SKELETON: portfolio. Hero through letters -> tall panel block (6 photos, one frame) -> film -> specs -> action
    MEDIA: Video3 (hero), Image1-6 (pc/phone), Video2        OPEN: contributors list removed until real names are confirmed
  -->
  <style>
    :root { --black: #050505; --white: #f0f0f0; --red: #ff1a1a; --gray: #1a1a1a; --ease: cubic-bezier(0.16, 1, 0.3, 1); --side: 4vw; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { overflow-x: clip; scroll-behavior: smooth; }
    body { background: var(--black); color: var(--white); font-family: 'Space Grotesk', sans-serif; overflow-x: clip; }
    a { color: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    .label { font-size: 0.75rem; letter-spacing: 0.4em; text-transform: uppercase; }

    nav { position: fixed; top: 0; left: 0; width: 100%; padding: 2rem var(--side); display: flex; justify-content: space-between; align-items: center; z-index: 100; mix-blend-mode: difference; color: #fff; }
    .nav-logo { font-family: 'Anton', sans-serif; font-size: 1.8rem; letter-spacing: 0.15em; text-decoration: none; }
    .nav-links { display: flex; gap: 2.4rem; list-style: none; }
    .nav-links a { text-decoration: none; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }

    /* 1. Hero: the film shows only through the word */
    .hero { position: relative; height: 100vh; height: 100svh; overflow: hidden; background: var(--black); }
    .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero-mask { position: absolute; inset: 0; z-index: 2; background: #fff; mix-blend-mode: screen; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .hero-mask b { font-family: 'Anton', sans-serif; font-weight: 400; font-size: clamp(5rem, 31vw, 36rem); line-height: 0.85; text-transform: uppercase; color: #000; letter-spacing: 0.01em; }
    .hero-foot { position: absolute; z-index: 3; left: var(--side); right: var(--side); bottom: 5vh; display: flex; justify-content: space-between; mix-blend-mode: difference; color: #fff; pointer-events: none; }

    /* 2. Tall panels: six photos, one block, one frame, one word */
    .work { position: relative; background: #000; }
    .work-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .work-grid div { aspect-ratio: 2 / 3; overflow: hidden; opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease, transform 1s var(--ease); }
    .work-grid div.in { opacity: 1; transform: none; }
    .work-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .work-title { position: absolute; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; font-family: 'Anton', sans-serif; font-weight: 400; font-size: clamp(3.4rem, 15vw, 15rem); line-height: 0.9; text-transform: uppercase; color: #fff; text-shadow: 0 0 5vw rgba(0,0,0,0.6); pointer-events: none; }
    .work::after { content: ''; position: absolute; z-index: 3; inset: clamp(0.8rem, 1.6vw, 1.6rem); border: 2px solid #fff; pointer-events: none; }

    /* 3. Film */
    .film { background: #000; padding-top: 2px; }
    .film video { display: block; width: 100%; height: 86vh; object-fit: cover; }

    /* 4. Specs */
    .specs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--white); color: var(--black); padding: 14vh var(--side); gap: 4vw; }
    .specs div { font-family: 'Anton', sans-serif; font-size: clamp(2.6rem, 9vw, 10rem); line-height: 0.88; text-transform: uppercase; opacity: 0; transform: translateY(0.12em) skewX(-8deg); transition: opacity 0.2s ease, transform 0.3s var(--ease); }
    .specs.in div { opacity: 1; transform: none; }
    .specs div:nth-child(2) { transition-delay: 0.12s; } .specs div:nth-child(3) { transition-delay: 0.24s; }
    .specs small { display: block; margin-top: 1.4rem; font-family: 'Space Grotesk', sans-serif; font-size: 0.75rem; letter-spacing: 0.4em; opacity: 0.6; }

    /* 5. Action */
    .act { padding: 16vh var(--side); text-align: center; }
    .act-title { font-family: 'Anton', sans-serif; font-weight: 400; font-size: clamp(3.5rem, 12vw, 11rem); line-height: 0.9; text-transform: uppercase; }
    .btn { display: inline-block; margin-top: 3rem; padding: 1.5rem 3rem; font-family: 'Anton', sans-serif; font-size: 1.1rem; letter-spacing: 0.14em; text-transform: uppercase; background: #fff; color: #000; text-decoration: none; }
    .btn:hover { background: var(--black); color: #fff; outline: 2px solid #fff; }
    .go { position: relative; display: inline-block; margin-top: 2.4rem; padding: 0.4rem 0; text-decoration: none; font-size: 0.8rem; letter-spacing: 0.35em; text-transform: uppercase; }
    .go::after { content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: 1px; background: currentColor; opacity: 0.5; }
    .go:hover::after { opacity: 1; }
    .act-links { display: flex; flex-direction: column; align-items: center; }

    footer { padding: 3rem var(--side); border-top: 1px solid var(--gray); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }
    footer .logo { font-family: 'Anton', sans-serif; font-size: 1.5rem; letter-spacing: 0.15em; }
    footer a { text-decoration: none; opacity: 0.6; margin-left: 1.5rem; }
    footer a:hover { opacity: 1; }
    footer span { opacity: 0.4; }

    @media (max-width: 700px) {
      :root { --side: 5vw; }
      nav { padding: 1.4rem 5vw; } .nav-logo { font-size: 1.4rem; } .nav-links { gap: 1.2rem; }
      .work-grid { grid-template-columns: repeat(2, 1fr); }
      .work-grid div { aspect-ratio: 3 / 5; }
      .film video { height: 60vh; }
      .specs { grid-template-columns: 1fr; gap: 3rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .work-grid div, .specs div { opacity: 1 !important; transform: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">EVRABO</a>
    <ul class="nav-links"><li><a href="originals.html">Originals</a></li><li><a href="contact.html">Contact</a></li></ul>
  </nav>
  <h1 class="sr-only">Katana, EVRABO SS/26 Issue II: The Work. 48 pages, perfect bound, limited run.</h1>

  <section class="hero">
    <video src="assets/videos/Video3.mp4" muted loop playsinline autoplay preload="auto" aria-hidden="true"></video>
    <div class="hero-mask" aria-hidden="true"><b>Katana</b></div>
    <div class="hero-foot label" aria-hidden="true"><span>SS / 26</span><span>Issue II</span></div>
  </section>

  <section class="work" aria-label="The Work, six photographs">
    <div class="work-grid">
      <div><picture><source media="(max-width: 700px)" srcset="assets/images/phone/image1.jpeg"><img src="assets/images/pc/Image1.jpeg" alt="Katana photograph 1" loading="lazy" decoding="async"></picture></div>
      <div><picture><source media="(max-width: 700px)" srcset="assets/images/phone/image2.jpeg"><img src="assets/images/pc/Image2.jpeg" alt="Katana photograph 2" loading="lazy" decoding="async"></picture></div>
      <div><picture><source media="(max-width: 700px)" srcset="assets/images/phone/image3.jpeg"><img src="assets/images/pc/Image3.jpeg" alt="Katana photograph 3" loading="lazy" decoding="async"></picture></div>
      <div><picture><source media="(max-width: 700px)" srcset="assets/images/phone/image4.png"><img src="assets/images/pc/Image4.jpeg" alt="Katana photograph 4" loading="lazy" decoding="async"></picture></div>
      <div><picture><source media="(max-width: 700px)" srcset="assets/images/phone/image5.jpeg"><img src="assets/images/pc/Image5.jpeg" alt="Katana photograph 5" loading="lazy" decoding="async"></picture></div>
      <div><picture><source media="(max-width: 700px)" srcset="assets/images/phone/image6.jpeg"><img src="assets/images/pc/image6.jpeg" alt="Katana photograph 6" loading="lazy" decoding="async"></picture></div>
    </div>
    <div class="work-title" aria-hidden="true">The Work</div>
  </section>

  <section class="film">
    <video src="assets/videos/Video2.mp4" muted loop playsinline preload="none" aria-label="Katana film"></video>
  </section>

  <section class="specs" id="specs">
    <div>48<small>Pages</small></div>
    <div>Perfect<br>bound<small>Format</small></div>
    <div>Limited<br>run<small>SS / 26</small></div>
  </section>

  <section class="act">
    <h2 class="act-title">Get a copy</h2>
    <div class="act-links">
      <a class="btn" href="contact.html">Get access</a>
      <a class="go" href="originals.html">Originals</a>
    </div>
  </section>

  <footer>
    <div class="logo">EVRABO</div>
    <div><a href="https://www.instagram.com/evrabo_" target="_blank" rel="noopener noreferrer">Instagram</a><a href="https://www.tiktok.com/@evrabo_" target="_blank" rel="noopener noreferrer">TikTok</a></div>
    <span>© 2026 EVRABO</span>
  </footer>

  <script>
    (function () {
      var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var tiles = [].slice.call(document.querySelectorAll('.work-grid div')), specs = document.getElementById('specs');
      if (!('IntersectionObserver' in window)) { tiles.forEach(function (t) { t.classList.add('in'); }); specs.classList.add('in'); }
      else {
        var io = new IntersectionObserver(function (es) {
          es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
        }, { threshold: 0.2 });
        tiles.forEach(function (t) { io.observe(t); }); io.observe(specs);
      }
      var vids = [].slice.call(document.querySelectorAll('video'));
      if (still || !('IntersectionObserver' in window)) { vids.forEach(function (v) { v.removeAttribute('autoplay'); v.pause(); }); return; }
      var vio = new IntersectionObserver(function (es) {
        es.forEach(function (e) { var v = e.target; if (e.isIntersecting) { var p = v.play(); if (p && p.catch) p.catch(function () {}); } else v.pause(); });
      }, { rootMargin: '30% 0px' });
      vids.forEach(function (v) { vio.observe(v); });
    })();
  </script>
</body>
</html>
