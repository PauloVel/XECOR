    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --black: #050505;
      --white: #f0f0f0;
      --red: #ff1a1a;
      --gray: #1a1a1a;
    }

    html {
      scroll-behavior: auto;
      overflow-x: hidden;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      cursor: none;
    }

    /* Custom Cursor */
    .cursor {
      position: fixed;
      width: 12px;
      height: 12px;
      background: var(--white);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference;
      transition: transform 0.1s ease;
    }

    .cursor-follower {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 1px solid var(--white);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      mix-blend-mode: difference;
      transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
    }

    .cursor.hover {
      transform: scale(3);
      background: var(--red);
    }

    .cursor-follower.hover {
      width: 60px;
      height: 60px;
      border-color: var(--red);
    }

    /* Noise Overlay */
    .noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9990;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9991;
      opacity: 0.03;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.03) 2px,
        rgba(255,255,255,0.03) 4px
      );
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 2rem 4vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      mix-blend-mode: difference;
    }

    .nav-logo {
      font-family: 'Anton', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      color: var(--white);
      text-decoration: none;
      transition: letter-spacing 0.4s ease;
    }

    .nav-logo:hover {
      letter-spacing: 0.3em;
    }

    .nav-links {
      display: flex;
      gap: 3rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--white);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 4px;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--red);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-links a:hover {
      color: var(--red);
    }

    .nav-links a.active {
      color: var(--red);
    }

    .nav-links a.active::after {
      width: 100%;
    }

    /* Contact: sharp split. White panel (reach us) / black panel (photo + form). */
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      --red: #f0f0f0; /* no red here: white accents */
    }

    .split-left {
      background: var(--white);
      color: var(--black);
      padding: 16vh 4vw 6vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4rem;
    }

    .split-title {
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      font-size: clamp(4.5rem, 13vw, 11rem);
      line-height: 0.9;
      text-transform: uppercase;
      letter-spacing: 0.01em;
    }

    .split-title span {
      display: block;
      overflow: hidden;
      margin-bottom: -0.04em;
    }

    .split-title span:nth-child(2) { padding-left: 1.2em; }

    .split-title i {
      display: block;
      font-style: normal;
      animation: line-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .split-title span:nth-child(2) i { animation-delay: 0.1s; }
    .split-title span:nth-child(3) i { animation-delay: 0.2s; }

    @keyframes line-in {
      from { transform: translateY(105%); }
      to { transform: translateY(0); }
    }

    .rows { border-top: 3px solid var(--black); }

    .row {
      display: grid;
      grid-template-columns: 6.5rem 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 0.8rem;
      border-bottom: 1px solid var(--black);
      color: var(--black);
      text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease, padding 0.25s ease;
    }

    .row-label {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    .row-value {
      font-family: 'Anton', sans-serif;
      font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .row-arrow { font-size: 1.4rem; line-height: 1; }

    .row:hover { background: var(--black); color: var(--white); padding-left: 1.4rem; }
    .row:hover .row-label { opacity: 0.7; }

    .split-right {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .split-photo {
      position: relative;
      height: 38vh;
      min-height: 260px;
      overflow: hidden;
      border-bottom: 3px solid var(--white);
      pointer-events: none;
    }

    .split-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 30% 40%;
      filter: grayscale(100%) contrast(1.25) brightness(0.8);
    }

    .split-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(5,5,5,0.9) 0%, rgba(5,5,5,0) 50%);
    }

    .split-photo figcaption {
      z-index: 1;
      position: absolute;
      left: 0;
      bottom: 0;
      padding: 0.6rem 1.2rem;
      background: var(--white);
      color: var(--black);
      font-family: 'Anton', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .contact-right { min-width: 0; padding: 5vh 4vw 8vh; }

    @media (max-width: 900px) {
      .split { grid-template-columns: 1fr; }
      .split-left { padding-top: 14vh; }
      .split-title span:nth-child(2) { padding-left: 0.6em; }
      .row { grid-template-columns: 1fr auto; }
      .row-label { grid-column: 1 / -1; }
      .mode-switch { width: 100%; }
      .mode-switch button { flex: 1; padding: 0.9rem 0.6rem; letter-spacing: 0.15em; }
    }

    @media (prefers-reduced-motion: reduce) {
      .split-title i { animation: none; }
    }

    /* Brutalist Form */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--red);
    }

    .form-group input,
    .form-group textarea {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.25);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      padding: 0.8rem 0;
      outline: none;
      transition: border-color 0.3s ease;
      border-radius: 0;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-bottom-color: var(--red);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-submit {
      align-self: flex-start;
      padding: 1rem 3.5rem;
      border: 1px solid var(--white);
      border-radius: 0;
      background: var(--white);
      color: var(--black);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .form-submit:hover {
      background: var(--black);
      color: var(--white);
    }

    /* Mode switch: General contact vs Free prototype */
    .mode-switch {
      display: flex;
      gap: 0;
      margin-bottom: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: fit-content;
    }

    .mode-switch button {
      padding: 0.9rem 1.8rem;
      background: transparent;
      border: 0;
      color: rgba(240, 240, 240, 0.55);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .mode-switch button + button { border-left: 1px solid rgba(255, 255, 255, 0.25); }
    .mode-switch button:hover { color: var(--white); }
    .mode-switch button[aria-selected="true"] { background: var(--white); color: var(--black); }

    .form-pane { display: flex; flex-direction: column; gap: 2rem; }
    .form-pane[hidden] { display: none; }

    .form-group select {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.25);
      border-radius: 0;
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      padding: 0.8rem 0;
      outline: none;
      cursor: pointer;
    }

    .form-group select:focus { border-bottom-color: var(--red); }
    .form-group select option { background: #050505; color: var(--white); }

    .form-steps {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1.6rem;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(240, 240, 240, 0.5);
    }

    .form-steps b { color: var(--white); font-weight: 600; margin-right: 0.5em; }

    .form-status { font-size: 0.85rem; line-height: 1.6; color: rgba(240, 240, 240, 0.7); }
    .form-status[hidden] { display: none; }
    .form-status a { color: var(--white); }

    footer {

    .footer-links a:hover {
      opacity: 1;
      color: var(--red);
    }

    .footer-copy {
      font-size: 0.75rem;
      opacity: 0.4;
      letter-spacing: 0.05em;
    }

    /* Glitch effect class */
    .glitch-text {
      position: relative;
    }

    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
    }

    .glitch-text.active::before {
      animation: glitch-1 0.3s ease;
      color: var(--red);
      z-index: -1;
      opacity: 0.8;
    }

    .glitch-text.active::after {
      animation: glitch-2 0.3s ease;
      color: cyan;
      z-index: -2;
      opacity: 0.8;
    }

    @keyframes glitch-1 {
      0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
      20% { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 2px); }
      40% { clip-path: inset(50% 0 30% 0); transform: translate(3px, -2px); }
      60% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 1px); }
      80% { clip-path: inset(70% 0 10% 0); transform: translate(2px, -1px); }
    }

    @keyframes glitch-2 {
      0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
      20% { clip-path: inset(60% 0 20% 0); transform: translate(3px, -2px); }
      40% { clip-path: inset(30% 0 50% 0); transform: translate(-3px, 2px); }
      60% { clip-path: inset(80% 0 10% 0); transform: translate(2px, -1px); }
      80% { clip-path: inset(10% 0 70% 0); transform: translate(-2px, 1px); }
    }


    /* Mobile Menu Toggle */
    .nav-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 200;
      padding: 0;
    }

    .nav-toggle span {
      display: block;
      width: 100%;
      height: 2px;
      background: var(--white);
      transition: all 0.3s ease;
    }

    .nav-toggle.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .nav-toggle.active span:nth-child(2) {
      opacity: 0;
    }

    .nav-toggle.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    .nav-mobile {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .nav-mobile.open {
      opacity: 1;
      pointer-events: auto;
    }

    .nav-mobile-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      text-align: center;
    }

    .nav-mobile-links a {
      font-family: 'Anton', sans-serif;
      font-size: clamp(2.5rem, 10vw, 5rem);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--white);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .nav-mobile-links a:hover {
      color: var(--red);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-toggle { display: flex; }
      .contact-section {
        grid-template-columns: 1fr;
        gap: 4rem;
      }
      .cursor, .cursor-follower { display: none; }
      body { cursor: auto; }
    }
  </style>
</head>

      const setMode = (mode) => {
        for (const k of Object.keys(panes)) {
          const on = k === mode;
          tabs[k].setAttribute('aria-selected', on ? 'true' : 'false');
          panes[k].hidden = !on;
          panes[k].querySelectorAll('input, select, textarea').forEach(el => { el.disabled = !on; });
        }
        status.hidden = true;
      };

      Object.keys(tabs).forEach(k => tabs[k].addEventListener('click', () => {
        setMode(k);
        history.replaceState(null, '', k === 'prototype' ? '#reserve' : location.pathname);
      }));

      const sendMail = (subject, lines) => {
        window.location.href = `mailto:${TO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join('\n'))}`;
        status.innerHTML = `Your email app should have opened with everything ready to send. If it didn't, write to <a href="mailto:${TO}">${TO}</a>.`;
        status.hidden = false;
      };

      panes.general.addEventListener('submit', (e) => {
        e.preventDefault();
        const d = new FormData(panes.general);
        sendMail(`Contact: ${d.get('name')}`, [`Name: ${d.get('name')}`, `Email: ${d.get('email')}`, '', d.get('message')]);
        panes.general.reset();
      });

      panes.prototype.addEventListener('submit', (e) => {
        e.preventDefault();
        const d = new FormData(panes.prototype);
        const lines = [`Company: ${d.get('company')}`, `Email: ${d.get('email')}`, `Prototype: ${d.get('type')}`];
        if (d.get('link')) lines.push(`Link: ${d.get('link')}`);
        if (styleBrief) lines.push(`Poster style: ${styleBrief}`);
        sendMail(`Prototype reservation: ${d.get('company')}`, lines);
        panes.prototype.reset();
      });

      setMode(location.hash === '#reserve' ? 'prototype' : 'general');
      window.addEventListener('hashchange', () => { if (location.hash === '#reserve') setMode('prototype'); });
    })();

    // Custom Cursor
    const cursor = document.querySelector('.cursor');
    const follower = document.querySelector('.cursor-follower');
    let mouseX = 0, mouseY = 0;
    let cursorX = 0, cursorY = 0;
    let followerX = 0, followerY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateCursor() {
      cursorX += (mouseX - cursorX) * 0.2;
      cursorY += (mouseY - cursorY) * 0.2;
      followerX += (mouseX - followerX) * 0.1;
      followerY += (mouseY - followerY) * 0.1;

      cursor.style.transform = `translate(${cursorX - 6}px, ${cursorY - 6}px)`;
      follower.style.transform = `translate(${followerX - 20}px, ${followerY - 20}px)`;

      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    document.querySelectorAll('a, button, input, textarea').forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.classList.add('hover');
        follower.classList.add('hover');
      });
      el.addEventListener('mouseleave', () => {
        cursor.classList.remove('hover');
        follower.classList.remove('hover');
      });
    });

    // Glitch Text Trigger on scroll
    const glitchTexts = document.querySelectorAll('.glitch-text');
    const glitchObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
          setTimeout(() => entry.target.classList.remove('active'), 400);
        }
      });
    }, { threshold: 0.3 });

    glitchTexts.forEach(el => glitchObserver.observe(el));
  
    // Mobile menu toggle
    const navToggle = document.querySelector('.nav-toggle');
    const navMobile = document.querySelector('.nav-mobile');
    if (navToggle && navMobile) {
      navToggle.addEventListener('click', () => {
        const isOpen = navMobile.classList.toggle('open');
        navToggle.classList.toggle('active');
        navToggle.setAttribute('aria-expanded', isOpen);
        document.body.style.overflow = isOpen ? 'hidden' : '';
      });

      navMobile.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          navMobile.classList.remove('open');
          navToggle.classList.remove('active');
          navToggle.setAttribute('aria-expanded', 'false');
          document.body.style.overflow = '';
        });
      });
    }

  </script>
</body>
</html>
